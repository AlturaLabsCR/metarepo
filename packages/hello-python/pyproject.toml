[project]
name = "metarepo-hello-python"
version = "0.1.0"
description = "A minimal Python example managed with uv"
requires-python = ">=3.10"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
metarepo-hello-python = "hello_python:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_python"]
